name: Lint

on:
  pull_request:
    paths:
      - src/*
  push:
    paths:
      - src/*

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: npm ci
      - run: npm run lint